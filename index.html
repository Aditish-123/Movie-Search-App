<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 Movie Search</h1>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            >
            <button onclick="searchMovies()">Search</button>
        </div>
    </header>

    <main>
        <h2>Popular Movies</h2>

        <div class="movie-container" id="movieContainer">

            <div class="movie-card">
                <img src="https://via.placeholder.com/250x350?text=Avengers" alt="Avengers">
                <h3>Avengers</h3>
                <p>⭐ 8.0</p>
                <span>2012</span>
            </div>

            <div class="movie-card">
                <img src="https://via.placeholder.com/250x350?text=Inception" alt="Inception">
                <h3>Inception</h3>
                <p>⭐ 8.8</p>
                <span>2010</span>
            </div>

            <div class="movie-card">
                <img src="https://via.placeholder.com/250x350?text=Interstellar" alt="Interstellar">
                <h3>Interstellar</h3>
                <p>⭐ 8.7</p>
                <span>2014</span>
            </div>

            <div class="movie-card">
                <img src="https://via.placeholder.com/250x350?text=Avatar" alt="Avatar">
                <h3>Avatar</h3>
                <p>⭐ 7.8</p>
                <span>2009</span>
            </div>

        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
